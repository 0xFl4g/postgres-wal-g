name: test

# Integration test: build the image locally, bring up postgres + an S3 server,
# archive WAL and push a base backup, then restore it into a fresh container
# and check that WAL written after the backup was replayed.
# No untrusted input flows into `run:` blocks — matrix.postgres is a
# hardcoded list and there are no github.event.* fields used.

# Pull requests run it directly; main pushes, release tags and the weekly
# rebuild run it via build.yml's `restore` job, which gates publishing.

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the one build.yml scanned)
        type: string
        required: true
      base_images:
        description: JSON map of postgres major to pinned base image (build.yml's resolve job)
        type: string
        required: true

permissions: {}

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: integration (pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    env:
      PG: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        # Required for cache-to + load: true. The default docker driver
        # doesn't support GHA cache export.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: postgres-wal-g:test
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres }}
            ${{ inputs.base_images && format('BASE_IMAGE={0}', fromJSON(inputs.base_images)[matrix.postgres]) || '' }}
          cache-from: type=gha,scope=test-pg${{ matrix.postgres }}
          cache-to: type=gha,mode=max,scope=test-pg${{ matrix.postgres }}

      - name: Start S3 server (versitygw)
        run: |
          # MinIO's images were withdrawn (repo archived); versitygw's posix
          # backend is a single container that enforces the access/secret pair,
          # so a secret that fails to reach wal-g fails the test.
          docker network create walg
          docker run -d --name s3 --network walg --tmpfs /data \
            versity/versitygw:v1.8.0 \
            --access testaccess --secret testsecret123 posix --nometa /data
          # posix backend: a bucket is a top-level directory.
          docker exec s3 mkdir /data/walg-test

      - name: Write secrets
        run: |
          mkdir -p /tmp/secrets
          printf '%s' "testaccess" > /tmp/secrets/access
          printf '%s' "testsecret123" > /tmp/secrets/secret

      - name: Start postgres-wal-g
        run: |
          # Credentials only via _FILE, so every `docker exec … wal-g` below
          # proves the wrapper unwraps them outside the entrypoint too.
          docker run -d --name pg --network walg \
            -v /tmp/secrets:/run/secrets:ro \
            -e POSTGRES_PASSWORD=test \
            -e WALG_S3_PREFIX=s3://walg-test \
            -e AWS_ENDPOINT=http://s3:7070 \
            -e AWS_REGION=us-east-1 \
            -e AWS_S3_FORCE_PATH_STYLE=true \
            -e AWS_ACCESS_KEY_ID_FILE=/run/secrets/access \
            -e AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/secret \
            postgres-wal-g:test \
            postgres \
              -c wal_level=replica \
              -c archive_mode=on \
              -c archive_command='/usr/local/bin/wal-g wal-push %p' \
              -c archive_timeout=10s
          # pg_isready alone also matches the temporary initdb server.
          for i in $(seq 1 60); do
            docker logs pg 2>&1 | grep -q 'init process complete' \
              && docker exec pg pg_isready -q -U postgres && break
            if [ "$i" = 60 ]; then
              echo "FAIL: postgres never became ready" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Base backup
        run: |
          docker exec pg psql -U postgres -c "
            CREATE TABLE t (id serial primary key, payload text);
            INSERT INTO t (payload) SELECT 'row-' || generate_series(1, 1000);
          "
          # Same form as the README: as the postgres user, into $PGDATA.
          docker exec -u postgres pg sh -c 'wal-g backup-push "$PGDATA"'
          backups=$(docker exec pg wal-g backup-list | tail -n +2 | wc -l)
          if [ "$backups" -lt 1 ]; then
            echo "FAIL: no backups visible in wal-g backup-list" >&2
            exit 1
          fi
          echo "OK: $backups backup(s) in S3"

      - name: WAL after the backup is archived
        run: |
          # These rows exist only in WAL, so the restore must replay it.
          docker exec pg psql -U postgres -c \
            "INSERT INTO t (payload) SELECT 'late-' || generate_series(1, 500);"
          seg=$(docker exec pg psql -U postgres -Atc "SELECT pg_walfile_name(pg_switch_wal());")
          for i in $(seq 1 30); do
            read -r archived failed <<<"$(docker exec pg psql -U postgres -Atc \
              "SELECT coalesce(last_archived_wal >= '$seg', false), failed_count FROM pg_stat_archiver;" | tr '|' ' ')"
            if [ "$failed" != 0 ]; then
              echo "FAIL: archive_command failed $failed time(s)" >&2
              exit 1
            fi
            [ "$archived" = t ] && break
            if [ "$i" = 30 ]; then
              echo "FAIL: segment $seg never archived" >&2
              exit 1
            fi
            sleep 1
          done
          echo "OK: $seg archived, 0 failures"

      - name: Restore into a fresh container
        run: |
          # pg18 keeps data under /var/lib/postgresql/18/docker (VOLUME
          # /var/lib/postgresql); earlier majors use VOLUME /var/lib/postgresql/data.
          if [ "$PG" -ge 18 ]; then mnt=/var/lib/postgresql; else mnt=/var/lib/postgresql/data; fi
          s3env=(-e WALG_S3_PREFIX=s3://walg-test -e AWS_ENDPOINT=http://s3:7070 -e AWS_REGION=us-east-1
                 -e AWS_S3_FORCE_PATH_STYLE=true -e AWS_ACCESS_KEY_ID_FILE=/run/secrets/access
                 -e AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/secret)
          # Same steps as the README restore procedure. Run as postgres: as root,
          # wal-g would create pg18's parent dir (18/) root-owned, and upstream
          # only fixes ownership inside $PGDATA.
          docker run --rm -u postgres --network walg -v restored:"$mnt" -v /tmp/secrets:/run/secrets:ro "${s3env[@]}" \
            postgres-wal-g:test \
            sh -c 'wal-g backup-fetch "$PGDATA" LATEST && touch "$PGDATA/recovery.signal"'
          docker run -d --name pgr --network walg -v restored:"$mnt" -v /tmp/secrets:/run/secrets:ro "${s3env[@]}" \
            postgres-wal-g:test \
            postgres -c restore_command='/usr/local/bin/wal-g wal-fetch %f %p'
          for i in $(seq 1 60); do
            [ "$(docker exec pgr psql -U postgres -Atc 'SELECT pg_is_in_recovery();' 2>/dev/null)" = f ] && break
            if [ "$i" = 60 ]; then
              echo "FAIL: restored postgres never finished recovery" >&2
              exit 1
            fi
            sleep 1
          done
          rows=$(docker exec pgr psql -U postgres -Atc "SELECT count(*) FROM t;")
          if [ "$rows" != 1500 ]; then
            echo "FAIL: restored $rows rows, want 1500 (base backup + replayed WAL)" >&2
            exit 1
          fi
          echo "OK: restored 1500 rows"

      - name: Verify multi-line _FILE secret
        run: |
          # Armored PGP key / JSON creds: internal newlines must survive,
          # the trailing newline must be stripped.
          printf 'line1\nline2\n' > /tmp/secrets/multiline
          docker run --rm \
            -v /tmp/secrets:/run/secrets:ro \
            -e WALG_PGP_KEY_FILE=/run/secrets/multiline \
            postgres-wal-g:test \
            bash -c '
              test "$WALG_PGP_KEY" = "$(printf "line1\nline2")" || { echo "FAIL: multi-line secret corrupted"; exit 1; }
              echo "OK: multi-line preserved"
            '

      - name: Verify POSTGRES_PASSWORD_FILE boots postgres
        # Regression test: the wrapper must NOT unwrap POSTGRES_*_FILE vars.
        # Upstream docker-entrypoint.sh resolves those itself and hard-errors
        # if both POSTGRES_PASSWORD and POSTGRES_PASSWORD_FILE are set.
        run: |
          printf '%s' "filesecret" > /tmp/secrets/pgpassword
          docker run -d --name pgfile \
            -v /tmp/secrets:/run/secrets:ro \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/pgpassword \
            postgres-wal-g:test
          for i in $(seq 1 60); do
            docker logs pgfile 2>&1 | grep -q 'init process complete' \
              && docker exec pgfile pg_isready -q -U postgres && break
            if [ "$i" = 60 ]; then
              echo "FAIL: postgres with POSTGRES_PASSWORD_FILE never became ready" >&2
              docker logs pgfile 2>&1 | tail -50
              exit 1
            fi
            sleep 1
          done
          docker rm -f pgfile

      - name: Dump logs on failure
        if: failure()
        run: |
          for c in pg pgr s3; do
            echo "=== $c logs ==="
            docker logs "$c" 2>&1 | tail -100 || true
          done
