name: build

# Build matrix: every supported postgres major × the WAL-G version pinned in
# the Dockerfile. Two jobs so third-party scanners never hold push/sign rights:
#   scan    — build amd64, Grype report + gate, smoke test (read-only token)
#   restore — test.yml's backup/restore round trip on the scanned commit
#   publish — multi-arch push with SBOM + provenance, cosign keyless signing
# Publishes to GHCR:
#   - v* tag push                → :<pg>-<walg>, :<pg>, :latest (newest pg only)
#   - weekly schedule / manual   → same release tags, rebuilt from the newest
#                                  v* tag to pick up upstream postgres minor
#                                  releases and Debian security fixes
#   - push to main               → :<pg>-edge only
#   - pull request               → scan only (plus an arm64 build check)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  # event_name keeps the weekly rebuild out of main's queue: a pending run in
  # a group is cancelled when another queues, which would drop that week.
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Newest postgres major in the matrix below — gets the :latest tag.
  # Bump together with the matrix when a new major lands.
  LATEST_PG: '18'

jobs:
  scan:
    name: scan pg${{ matrix.postgres }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload Grype SARIF to code scanning
    outputs:
      sha: ${{ steps.src.outputs.sha }}
      walg: ${{ steps.walg.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Rebuilds need the tag list to find the newest release.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out newest release (scheduled/manual rebuild)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: git checkout "$(git tag -l 'v*' --sort=-v:refname | head -n1)"

      - name: Record source commit
        id: src
        # publish checks out exactly this commit, so it ships what was scanned.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve WAL-G version
        id: walg
        run: |
          # The Dockerfile ARG is the single source of truth, so a rebuild of
          # an old release tag uses that release's WAL-G version.
          version="$(sed -n 's/^ARG WAL_G_VERSION=//p' Dockerfile)"
          if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not parse WAL-G version from Dockerfile: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (PR arm64 check)
        if: github.event_name == 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: postgres-wal-g:scan
          build-args: POSTGRES_VERSION=${{ matrix.postgres }}
          cache-from: type=gha,scope=pg${{ matrix.postgres }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.postgres }}

      - name: Vulnerability report (all findings)
        id: report
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: postgres-wal-g:scan
          fail-build: false
          output-format: sarif

      - name: Upload report to code scanning
        # Fork PRs get a read-only token that can't write security events.
        if: github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.report.outputs.sarif }}
          # Release rebuilds scan a different image than main; separate
          # categories stop their alerts from flipping each other open/fixed.
          category: grype-pg${{ matrix.postgres }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-release' || '' }}

      - name: Vulnerability scan (fixable only, for the gate)
        id: gatescan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: postgres-wal-g:scan
          only-fixed: true
          fail-build: false
          output-format: json

      - name: Vulnerability gate (fixable HIGH+ in OS packages)
        env:
          REPORT: ${{ steps.gatescan.outputs.json }}
        run: |
          # Allowlist: only Debian packages gate, because a rebuild fixes those.
          # Everything else (Go modules in wal-g/gosu, ...) is only fixable
          # upstream and is reported to code scanning above instead.
          jq -r '.matches[]
            | select(.artifact.type == "deb" and .vulnerability.fix.state == "fixed"
                     and (.vulnerability.severity == "High" or .vulnerability.severity == "Critical"))
            | "\(.vulnerability.severity)\t\(.vulnerability.id)\t\(.artifact.name) \(.artifact.version) -> \(.vulnerability.fix.versions | join(","))"' \
            "$REPORT" | sort -u > gate.txt
          if [ -s gate.txt ]; then
            echo "Fixable HIGH/CRITICAL vulnerabilities in OS packages:" >&2
            cat gate.txt >&2
            exit 1
          fi
          echo "Gate passed: no fixable HIGH/CRITICAL in OS packages."

      - name: Smoke test
        run: |
          # Goes through the /usr/local/bin/wal-g wrapper symlink.
          docker run --rm --entrypoint wal-g postgres-wal-g:scan --version
          docker run --rm --entrypoint postgres postgres-wal-g:scan --version

      - name: Build arm64 (PR check, not pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: POSTGRES_VERSION=${{ matrix.postgres }}
          cache-from: type=gha,scope=pg${{ matrix.postgres }}

  restore:
    # The WAL-G round trip (archive, backup, restore + replay) for every major
    # against the exact commit scan built. A broken restore blocks publishing.
    # Scheduled/dispatch rebuilds run main's test.yml against the newest tag's
    # code: `uses: ./` resolves at the caller's commit, `ref` only picks the checkout.
    needs: scan
    if: github.event_name != 'pull_request'
    permissions:
      contents: read # checkout
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    with:
      ref: ${{ needs.scan.outputs.sha }}

  publish:
    name: publish pg${{ matrix.postgres }}
    # Needs the whole scan and restore matrices: one major failing a gate
    # blocks publishing for all majors in this run.
    needs: [scan, restore]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to GHCR
      id-token: write # cosign keyless signing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scan.outputs.sha }}
          persist-credentials: false

      - name: Resolve image name (lowercase)
        id: image
        env:
          OWNER_REPO: ${{ github.repository }}
        run: |
          # Docker registries reject mixed-case repository names. Lowercase
          # the full owner/repo path here so :tag composition is safe later.
          lower="$(printf '%s' "$OWNER_REPO" | tr '[:upper:]' '[:lower:]')"
          echo "name=$lower" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        env:
          PG: ${{ matrix.postgres }}
          WALG: ${{ needs.scan.outputs.walg }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          image="${REGISTRY}/${IMAGE}"
          tags=""
          case "$EVENT:$REF" in
            push:refs/tags/v*|schedule:*|workflow_dispatch:*)
              tags="${image}:${PG}-${WALG},${image}:${PG}"
              if [ "$PG" = "$LATEST_PG" ]; then
                tags="${tags},${image}:latest"
              fi
              ;;
            push:refs/heads/main)
              tags="${image}:${PG}-edge"
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: POSTGRES_VERSION=${{ matrix.postgres }}
          sbom: true
          provenance: mode=max
          # No GHA cache here: scan's third-party scanner could write cache
          # entries this job would then push and sign. Cold build is minutes.

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Signs the digest, so every tag pointing at it is covered.
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
